name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
  browser:
    # Real Chromium: Web Workers, pdf.js and Main-thread-vs-Workers numbers
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:browser
      - uses: actions/upload-artifact@v4
        with: { name: verify-results, path: verify-results.json }
      # UI smoke test against the real Next.js server (browser-only part; the full-stack run needs backend + AI)
      - run: npm run build
      - run: (npx next start -p 3000 &) && npx --yes wait-on http://localhost:3000/analizar
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SKIP_BACKEND: "1"
